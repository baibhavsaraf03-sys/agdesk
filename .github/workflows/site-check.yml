name: Site check

# Manual: asks the live site for the endpoints that depend on outside
# sources (prices, the share card, currencies), checks which database tables
# exist and whether the push keys are stored, and prints what came back.
# No secret value is ever printed.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SITE: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://ledgedesk.com' }}
    steps:
      - name: Which address is checked
        run: echo "Checking $SITE"

      - name: Database tables (exist? rows?)
        env:
          SB: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          for t in profiles market_reads articles article_editors watchlist alerts alert_events push_subscriptions social_posts social_tokens broker_links; do
            code=$(curl -sS -o /dev/null -D head.txt -w "%{http_code}" --max-time 20 "$SB/rest/v1/$t?select=*&limit=0" -H "apikey: $KEY" -H "authorization: Bearer $KEY" -H "Prefer: count=exact")
            rows=$(grep -i '^content-range' head.txt | tr -d '\r' | sed 's#.*/##')
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then echo "$t: ready, $rows rows"; else echo "$t: MISSING (HTTP $code)"; fi
          done

      - name: Broker linking (My positions)
        run: |
          curl -sS --max-time 30 "$SITE/api/broker" | python3 -c 'import json,sys; j=json.load(sys.stdin); print("SnapTrade keys in Vercel:", "yes" if j.get("configured") else "NO (add SNAPTRADE_OAUTH_CLIENT_ID and SNAPTRADE_OAUTH_CLIENT_SECRET, then redeploy)")'
          curl -sS -o /dev/null --max-time 20 -w "SnapTrade sign-in server: HTTP %{http_code}\n" "https://api.snaptrade.com/.well-known/oauth-authorization-server"
          for u in info accessibility; do curl -sS -o /dev/null --max-time 30 -w "/$u: HTTP %{http_code}\n" "$SITE/$u"; done

      - name: Market reads on the live site (what the home brief chooses from)
        run: |
          curl -sS --max-time 30 "$SITE/api/feed" | python3 -c '
          import json,sys
          r=json.load(sys.stdin).get("reads",{})
          for z,v in sorted(r.items(), key=lambda kv: kv[1].get("_updatedAt",""), reverse=True):
              s=v.get("short") or []
              print(f"{z:5} {v.get("_updatedAt","")[:16]}  {v.get("phase",""):9} writer={v.get("writer","?"):9} short={len(s)}  {(s[0] if s else v.get("headline",""))[:90]}")'

      - name: Which screens people open (last 30 days, public.screen_visits)
        env:
          SB: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SINCE=$(date -u -d '30 days ago' +%Y-%m-%d)
          curl -sS --max-time 20 "$SB/rest/v1/screen_visits?select=day,screen,visits&day=gte.$SINCE&limit=5000" -H "apikey: $KEY" -H "authorization: Bearer $KEY" | python3 -c '
          import json,sys,collections
          rows=json.load(sys.stdin)
          if isinstance(rows,dict): print("usage table not set up yet:", rows.get("message")); sys.exit(0)
          tot=collections.Counter(); last7=collections.Counter(); days=sorted({r["day"] for r in rows})
          recent=set(days[-7:])
          for r in rows:
              tot[r["screen"]]+=r["visits"]
              if r["day"] in recent: last7[r["screen"]]+=r["visits"]
          print(f"{sum(tot.values())} screen opens over {len(days)} days")
          for s,n in tot.most_common(): print(f"  {s:6} {n:6}  last 7 days {last7[s]:5}")
          '

      - name: Scheduler and Instagram checklist (public.ledge_check)
        env:
          SB: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          curl -sS --max-time 20 -X POST "$SB/rest/v1/rpc/ledge_check" -H "apikey: $KEY" -H "authorization: Bearer $KEY" -H "content-type: application/json" -d '{}' | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          if isinstance(d,dict): print("checklist not installed yet:", d.get("message")); sys.exit(0)
          for r in d: print(f"{r["result"]:>9}  {r["item"]}  {r["todo"] or ""}")'
          echo "INSTAGRAM_TOKEN secret: ${{ secrets.INSTAGRAM_TOKEN != '' && 'present' || 'not set' }}"

      - name: Push keys present (values never printed)
        env:
          PUB: ${{ secrets.VAPID_PUBLIC_KEY }}
          PRIV: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -n "$PUB" ]; then echo "GitHub secret VAPID_PUBLIC_KEY is set"; else echo "GitHub secret VAPID_PUBLIC_KEY is missing"; fi
          if [ -n "$PRIV" ]; then echo "GitHub secret VAPID_PRIVATE_KEY is set"; else echo "GitHub secret VAPID_PRIVATE_KEY is missing"; fi
          code=$(curl -sS -o push.json -w "%{http_code}" --max-time 20 "$SITE/api/push")
          if grep -q '"publicKey":"B' push.json; then echo "Vercel VAPID_PUBLIC_KEY is set (HTTP $code)"; else echo "Vercel VAPID_PUBLIC_KEY looks missing (HTTP $code)"; fi
          site=$(python3 -c 'import json;print(json.load(open("push.json")).get("publicKey",""))' 2>/dev/null)
          if [ -n "$site" ] && [ "$site" = "$(printf %s "$PUB" | tr -d '[:space:]')" ]; then echo "Public keys match: Vercel and GitHub"; else echo "PUBLIC KEYS DIFFER: Vercel's VAPID_PUBLIC_KEY is not the same as GitHub's (fingerprints $(printf %s "$site" | sha256sum | cut -c1-8) vs $(printf %s "$PUB" | tr -d '[:space:]' | sha256sum | cut -c1-8))"; fi
          # Does the private key belong to GitHub's public key? (web-push signs with the pair)
          cd "$GITHUB_WORKSPACE" && npm i --no-save --no-audit --no-fund web-push >/dev/null 2>&1 && node -e '
            const c=require("crypto");const b=s=>Buffer.from(s.trim().replace(/-/g,"+").replace(/_/g,"/"),"base64");
            try{const e=c.createECDH("prime256v1");e.setPrivateKey(b(process.env.PRIV));
              console.log(e.getPublicKey().equals(b(process.env.PUB))?"GitHub private key matches GitHub public key":"GITHUB KEYS ARE NOT A PAIR: the private key does not belong to the public key")}
            catch(x){console.log("could not compare the GitHub keys:",x.message)}'

      - name: Pages
        run: |
          for u in "" "signin" "learn" "articles"; do
            curl -sS -o /dev/null --max-time 30 -w "/$u: HTTP %{http_code}\n" "$SITE/$u"
          done

      - name: Pulse (home instruments)
        run: |
          curl -sS --max-time 40 "$SITE/api/pulse" | python3 -c '
          import json,sys
          j=json.load(sys.stdin)
          print("mood:", j.get("mood"))
          for i in j.get("instruments",[]): print(i["k"], i.get("price"), i.get("change"), i.get("error",""))
          s=j.get("session") or {}
          print("session points:", len(s.get("points",[])))'

      - name: Share card and link preview
        run: |
          mkdir -p cards
          curl -sS --max-time 60 -o cards/story.png -w "card: HTTP %{http_code}, %{content_type}, %{size_download} bytes\n" "$SITE/card"
          curl -sS --max-time 60 -o cards/og.png -w "card?format=og: HTTP %{http_code}, %{content_type}, %{size_download} bytes\n" "$SITE/card?format=og"

      - name: Keep the cards for a look
        uses: actions/upload-artifact@v4
        with:
          name: cards
          path: cards/
          retention-days: 3

      - name: Currencies
        run: curl -sS --max-time 40 "$SITE/api/fx" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status"))'

      - name: Sovereign debt, one country (Nepal) and the country list
        run: |
          curl -sS --max-time 60 "$SITE/api/sov?list=1" | python3 -c 'import json,sys; c=json.load(sys.stdin).get("countries",[]); print(len(c), "countries", [x["name"] for x in c[:5]])'
          curl -sS --max-time 60 "$SITE/api/sov?country=NPL" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          print(d.get("name"), d.get("status"))
          for r in d.get("rows",[])[-3:]:
              print(r["year"], {k:(round(v/1e9,2) if isinstance(v,(int,float)) and v>1e6 else (round(v,1) if isinstance(v,(int,float)) else v)) for k,v in r.items() if k!="year"})
          print("lenders", d.get("lendersYear"), [(l["name"], round(l["value"]/1e9,2)) for l in d.get("lenders",[])])
          '

      - name: Sovereign debt figures (World Bank)
        run: |
          curl -sS --max-time 60 "$SITE/api/sov" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          print("status", d.get("status"))
          for iso,c in sorted(d.get("countries",{}).items()):
              f=lambda k: "-" if c.get(k) is None else f"{c[k]/1e9:.1f}"
              print(iso, c.get("year"), "total", f("total"), "imf", f("imf"), "multi", f("multilateral"), "bilat", f("bilateral"), "bonds", f("bonds"), "banks+", f("banks"), "other", f("other"), "service%", c.get("service"))
          '
