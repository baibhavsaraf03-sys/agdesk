name: Probe

# Manual one-off checks against outside data sources that the build sandbox
# cannot reach. Pick the script to run.

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Probe to run"
        required: true
        default: worldbank
        type: choice
        options: [worldbank, sec]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node scripts/probe-${{ inputs.script }}.mjs
