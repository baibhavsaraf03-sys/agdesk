name: Market reads

# Every zone, the agricultural read and the AI-trade read, rewritten every
# hour, every day of the week. Each run works out from the local clock whether
# a zone is opening, mid-session, closing, shut overnight or shut for the
# weekend, so the schedule needs only one line and daylight saving looks
# after itself.
#
# Writers, in order: Gemini's free tier (Flash-Lite first, which has the
# larger daily allowance, then Flash); Groq's free tier if the GROQ_API_KEY
# secret is set; then the paid Anthropic key, but only for a zone whose read
# is already six hours old, so it keeps a screen from going stale and never
# runs hourly. Set the FEED_ALLOW_PAID variable to 0 to switch the paid step
# off entirely, or FEED_PAID_AFTER_HOURS to change the six. A zone
# whose figures and headlines have not changed since its last read is skipped
# rather than rewritten, which is most of them overnight and at weekends. If
# every model is busy, that hour's read fails and the previous one stays up.
#
# The minute is deliberately off the hour: every scheduled job on the
# platform fires at :00, and queue delay there can run to many minutes.

on:
  schedule:
    - cron: "23 * * * *"

  # Run by hand from the Actions tab: one zone or all of them.
  workflow_dispatch:
    inputs:
      zone:
        description: "Zone to read"
        required: true
        default: "all"
        type: choice
        options: [all, anz, eas, ind, eur, ams, ag, doom]
      phase:
        description: "Phase (auto works it out from the zone's local time)"
        required: true
        default: "auto"
        type: choice
        options: [auto, open, midday, close, overnight, weekend]
      force:
        description: "Rewrite even if nothing has changed"
        required: false
        default: false
        type: boolean

# One run at a time, so a slow hour never overlaps the next and doubles the
# calls against the free quota.
concurrency:
  group: market-reads
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --omit=dev

      # Zones run one after another rather than in parallel: the free tier
      # limits requests per minute, and this keeps well under it. One zone
      # failing does not stop the others; the job fails at the end so the
      # Actions tab still shows that something went wrong.
      - name: Run the reads
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEED_ALLOW_PAID: ${{ vars.FEED_ALLOW_PAID || '1' }}
          FEED_PAID_AFTER_HOURS: ${{ vars.FEED_PAID_AFTER_HOURS || '6' }}
          # Optional. Groq's free tier, tried after Gemini and before the paid key.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Optional. Without it the reads lose oil, the dollar index and
          # fertiliser PPI; the run still succeeds, just thinner.
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FEED_PROVIDER: ${{ vars.FEED_PROVIDER || 'gemini' }}
          # Tried in order, all free tier. Override with the GEMINI_HOURLY_MODELS variable.
          GEMINI_FEED_MODEL: ${{ vars.GEMINI_HOURLY_MODELS || 'gemini-flash-lite-latest,gemini-flash-latest' }}
          FEED_MODEL: ${{ vars.FEED_MODEL || 'claude-sonnet-5-5' }}
          FEED_MAX_TOKENS: ${{ vars.FEED_MAX_TOKENS || '20000' }}
          ZONE: ${{ inputs.zone || 'all' }}
          PHASE: ${{ inputs.phase || 'auto' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          if [ "$ZONE" = "all" ]; then ZONES="ams eur doom ag eas ind anz"; else ZONES="$ZONE"; fi
          failed=""
          for z in $ZONES; do
            node scripts/feed-read.mjs --zone "$z" --phase "$PHASE" $FORCE || failed="$failed $z"
          done
          if [ -n "$failed" ]; then
            echo "::warning::These zones kept their previous read:$failed"
            exit 1
          fi
